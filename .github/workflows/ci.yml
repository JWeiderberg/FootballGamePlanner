name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ContinuousIntegrationBuild: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore (fails on vulnerable packages)
        run: dotnet restore FootballGamePlanner.slnx

      - name: Build (warnings are errors)
        run: dotnet build FootballGamePlanner.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test FootballGamePlanner.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFilePrefix=results"
          --results-directory TestResults

      - name: Check for vulnerable and deprecated packages
        run: |
          dotnet list FootballGamePlanner.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
